{
  "name": "OpenSpec Backend · Propose",
  "state": "ACTIVE",
  "enabled": true,
  "trigger": {
    "type": "event",
    "source": "openspec-role-dashboard",
    "on": "propose.requested",
    "filter": "schema == 'openspec-role-dashboard/v3' && stage == 'propose' && approval == 'propose' && role == 'Backend'"
  },
  "entrypoint": "python3 run.py",
  "timeout": 1800,
  "keep_alive": false,
  "tarball_source": {
    "type": "internal"
  }
}
