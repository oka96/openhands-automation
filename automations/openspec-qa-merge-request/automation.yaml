{
  "name": "OpenSpec QA · Merge Request",
  "state": "ACTIVE",
  "enabled": true,
  "trigger": {
    "type": "event",
    "source": "openspec-role-dashboard",
    "on": "merge-request.requested",
    "filter": "schema == 'openspec-role-dashboard/v3' && stage == 'merge-request' && approval == 'merge-request' && role == 'QA'"
  },
  "entrypoint": "python3 run.py",
  "timeout": 1800,
  "keep_alive": false,
  "tarball_source": {
    "type": "internal"
  }
}
