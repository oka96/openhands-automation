{
  "name": "OpenSpec 01 · Explore",
  "state": "ACTIVE",
  "enabled": true,
  "trigger": {
    "type": "event",
    "source": "openspec-dashboard",
    "on": "explore.requested",
    "filter": "schema == 'openspec-dashboard/v1' && stage == 'explore' && approval == 'explore'"
  },
  "entrypoint": "python3 run.py",
  "timeout": 1800,
  "keep_alive": false,
  "tarball_source": {
    "type": "internal"
  }
}
