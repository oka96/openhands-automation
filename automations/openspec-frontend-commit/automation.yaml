{
  "name": "OpenSpec Frontend · Commit",
  "state": "ACTIVE",
  "enabled": true,
  "trigger": {
    "type": "event",
    "source": "openspec-role-dashboard",
    "on": "commit.requested",
    "filter": "schema == 'openspec-role-dashboard/v3' && stage == 'commit' && approval == 'commit' && role == 'Frontend'"
  },
  "entrypoint": "python3 run.py",
  "timeout": 1800,
  "keep_alive": false,
  "tarball_source": {
    "type": "internal"
  }
}
